services:
  redis:
    image: redis
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    ports:
      - "8002:8002"
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      - redis

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    ports:
      - "8004:8004"
    depends_on:
      - redis
